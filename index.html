<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>这是一个不知道干啥的网页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #333;
        }
        header {
            background: #2d8cf0;
            color: #fff;
            padding: 24px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        /* 登录容器样式 */
        .login-box {
            width: 400px;
            margin: 80px auto;
            background: #fff;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .tip-text {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-bottom: 25px;
        }
        .form-item {
            margin-bottom: 20px;
        }
        .form-item label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .form-item input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        .login-btn {
            width: 100%;
            height: 46px;
            background-color: #2d8cf0;
            border: none;
            color: white;
            font-size: 17px;
            border-radius: 6px;
            cursor: pointer;
        }
        .login-btn:hover {
            background-color: #1b78d8;
        }

        /* 登录成功主页 */
        .main-page {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            display: none;
        }
        .logout-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: #ee4444;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }
        .logout-btn:hover {
            background: #dd2222;
        }
        .jump-btn {
            margin: 20px 0;
            padding: 12px 26px;
            background: #fb7299;
            border: none;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .jump-btn:hover {
            background: #f75b88;
        }
    </style>
</head>
<body>
    <header>这是一个不知道干啥的网页</header>

    <!-- 登录区域 -->
    <div class="login-box" id="loginWrap">
        <div class="tip-text">请先登录后使用</div>
        <div class="form-item">
            <label>账号</label>
            <input type="text" id="username" placeholder="请输入账号">
        </div>
        <div class="form-item">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button class="login-btn" onclick="login()">登录</button>
    </div>

    <!-- 登录成功后的主页 -->
    <div class="main-page" id="mainWrap">
        <h2>🎉 登录成功，欢迎你，<span id="showUser"></span></h2>
        <p style="margin-top:15px;line-height:1.8;">当前网页功能尚未开发，尽情期待后续更新~</p>
        <!-- 新增跳转B站按钮 -->
        <button class="jump-btn" onclick="goBilibili()">这个按钮有什么用</button>
        <br>
        <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>

    <script>
        // 页面加载时，检测本地存储是否存在登录信息，永久保存依靠 localStorage
        window.onload = function () {
            let user = localStorage.getItem("loginUser");
            if (user) {
                // 已登录，显示主页，隐藏登录框
                document.getElementById("loginWrap").style.display = "none";
                document.getElementById("mainWrap").style.display = "block";
                document.getElementById("showUser").innerText = user;
            }
        }

        // 登录函数
        function login() {
            let name = document.getElementById("username").value.trim();
            let pwd = document.getElementById("password").value.trim();
            if (!name) {
                alert("请输入账号");
                return;
            }
            if (!pwd) {
                alert("请输入密码");
                return;
            }
            // 将账号永久存入浏览器本地存储，删除浏览器数据前不会失效
            localStorage.setItem("loginUser", name);
            // 切换页面
            document.getElementById("loginWrap").style.display = "none";
            document.getElementById("mainWrap").style.display = "block";
            document.getElementById("showUser").innerText = name;
            alert("登录成功！登录状态已永久保存");
        }

        // 退出登录，清空本地存储
        function logout() {
            localStorage.removeItem("loginUser");
            document.getElementById("loginWrap").style.display = "block";
            document.getElementById("mainWrap").style.display = "none";
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
            alert("已退出登录");
        }

        // 跳转B站函数
        function goBilibili() {
            window.open('https://www.bilibili.com', '_blank');
        }
    </script>
</body>
</html>
